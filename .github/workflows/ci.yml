name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: calvin
          POSTGRES_PASSWORD: calvin
          POSTGRES_DB: calvin_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U calvin -d calvin_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://calvin:calvin@localhost:5433/calvin_dev
      TEST_DATABASE_URL: postgres://calvin:calvin@localhost:5433/calvin_test
      NODE_ENV: test
      CLIENT_URL: http://localhost:3000
      PORT: 5000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write .env for scripts that read it directly
        run: |
          cat > .env <<EOF
          DATABASE_URL=$DATABASE_URL
          TEST_DATABASE_URL=$TEST_DATABASE_URL
          NODE_ENV=$NODE_ENV
          CLIENT_URL=$CLIENT_URL
          PORT=$PORT
          EOF

      - name: Create the test database
        run: PGPASSWORD=calvin psql -h localhost -p 5433 -U calvin -d calvin_dev -c "CREATE DATABASE calvin_test;" || true

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the loop gate
        run: npm run gate

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: gate-report.json
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
