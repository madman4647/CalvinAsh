services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calvin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calvin}
      POSTGRES_DB: ${POSTGRES_DB:-calvin_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - calvin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calvin} -d ${POSTGRES_DB:-calvin_dev}"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  calvin_pgdata:
